<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Functional Group Matches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">HIV Molecule Predictor</a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="card-title">Molecules containing: <span class="text-primary">{{ group }}</span></h4>

                    {% if matches %}
                        <ul class="list-group mt-3">
                            {% for m in matches %}
                                <li class="list-group-item"><code class="smiles">{{ m }}</code></li>
                            {% endfor %}
                        </ul>
                    {% else %}
                        <div class="alert alert-warning mt-3">No molecules with this group found.</div>
                    {% endif %}

                    <div class="mt-4">
                        <a class="btn btn-secondary" href="/">Back</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
